<div class="grid grid-cols-3 gap-2.5">${[['ผู้ใช้',ks.length],['กิจกรรม',S.acts.length],['Feedback ใหม่',S.fb.filter(f=>f.st==='new').length]].map(x=>`<div class="${CARD} p-3 text-center"><b class="text-2xl text-primary">${x[1]}</b><div class="text-[11px] text-slate-500">${x[0]}</div></div>`).join('')}</div>
${[['การใช้งานแต่ละฟังก์ชัน (จำนวนครั้ง)',ev],['เป้าหมายของผู้ใช้ในการใช้ระบบ',gl],['กิจกรรมที่สะสม แยกตามชั้นปี',yr],['ผู้ใช้ แยกตามหลักสูตร',pg],['ผู้ใช้ แยกตามสาขาวิชา/วิชาเอก',mj]].map(x=>`<div class="${CARD} p-4"><b class="text-[14px] block mb-3">${x[0]}</b>${bars(x[1])}</div>`).join('')}<p class="text-[11px] text-slate-400">${CLOUD?'* รวมข้อมูลจากนิสิตทุกคนที่เปิดลิงก์นี้ (ฐานข้อมูลของ claude.ai)':'* โหมดออฟไลน์: เก็บข้อมูลในเบราว์เซอร์เครื่องนี้เท่านั้น'}</p>`},

${l.length?l.map(f=>`<button data-act="tr" data-p="${f.id}" class="${CARD} p-4 w-full text-left"><div class="flex justify-between items-center mb-1"><span class="text-[11px] px-2 py-0.5 rounded-full bg-brand-50 text-brand-600 font-semibold">${esc(f.cat||'อื่น ๆ')}${f.part?' · '+esc(f.part):''}</span><span class="text-[11px] text-slate-400">${fmt(f.at)}${f.y?' · '+esc(f.y):''}</span></div>${f.rate?`<div class="text-amber-500 text-[13px]">${'★'.repeat(f.rate)}${'☆'.repeat(5-f.rate)}</div>`:''}<p class="text-[13px] mt-1">${esc(f.msg)}</p>${f.st==='tri'?`<div class="flex gap-1.5 flex-wrap mt-2 text-[11px]"><span class="px-2 py-0.5 rounded-md bg-slate-100">${esc(f.area)}</span><span class="px-2 py-0.5 rounded-md bg-slate-100">MVP: ${f.mvp==='y'?'ส่งผล':'ไม่ส่งผล'}</span><span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-700">ความสำคัญ: ${{high:'สูง',mid:'กลาง',low:'ต่ำ'}[f.pri]||'-'}</span></div>${f.act?`<p class="text-[12px] text-slate-500 mt-1">แนวทาง: ${esc(f.act)}</p>`:''}`:''}</button>`).join(''):empty('inbox','ยังไม่มี Feedback ในหมวดนี้','')}`}};

const LAST={},SEEN={};let _t=null,_q=Promise.resolve(),PENDING=false;
const own=a=>(S.users[a.u]||{}).owner;
const BUILD={profiles:u=>({accounts:Object.values(S.users).filter(a=>a.owner===u).map(({owner:_o,...r})=>r)}),
acts:u=>({list:S.acts.filter(a=>own(a)===u).map(a=>({...a,imgs:(a.imgs||[]).map(i=>({id:i.id,n:i.n}))}))}),
goals:u=>({list:S.goals.filter(g=>own(g)===u)}),
events:u=>({counts:Object.fromEntries(Object.entries(S.cnt).filter(([k])=>(S.users[k]||{}).owner===u))}),
feedback:u=>({items:S.fb.filter(f=>own(f)===u)})};
const isEmpty=d=>!d||(d.accounts&&!d.accounts.length)||(d.list&&!d.list.length)||(d.items&&!d.items.length)||(d.counts&&!Object.keys(d.counts).length);
function queueSync(){PENDING=true;clearTimeout(_t);_t=setTimeout(()=>{_q=_q.then(syncAll).catch(()=>{}).then(()=>{if(!_t)PENDING=false})},700)}
async function syncAll(){if(!CLOUD||!DB){PENDING=false;return}_t=null;const jobs=['profiles','acts','goals','events'].map(k=>[k,UID]);for(const u of(CANEDIT?[...new Set([UID,...Object.values(S.users).map(a=>a.owner),...S.fb.map(f=>own(f))].filter(Boolean))]:[UID]))jobs.push(['feedback',u]);
for(const[k,u]of jobs){const d=BUILD[k](u);if(!d)continue;const p=k+'/'+u,j=JSON.stringify(d);if(LAST[p]===j||(LAST[p]===undefined&&isEmpty(d)))continue;try{await DB.doc(p).set(d);LAST[p]=j}catch(e){if(e&&e.code==='quota_exceeded')toast('ฐานข้อมูลเต็ม บันทึกไม่ครบ');else if(e&&e.code!=='unavailable')toast('บันทึกขึ้นฐานข้อมูลไม่สำเร็จ')}}
PENDING=!!_t}
function apply(k,u,d){if(u===UID&&SEEN[k]&&k!=='feedback')return false;if(PENDING&&k==='feedback')return false;const before=JSON.stringify(BUILD[k](u));d=d||{};
if(k==='profiles'){let acc=d.accounts;if(!acc&&d.nick)acc=[{id:u,username:d.nick,nick:d.nick,email:d.email||'',faculty:d.faculty||'',major:d.major||'',year:d.year||'',goals:d.goals||[]}];Object.keys(S.users).forEach(id=>{if(S.users[id].owner===u)delete S.users[id]});(acc||[]).forEach(a=>{S.users[a.id]={...a,owner:u}})}
else if(k==='acts'){const L=(d.list||[]).map(a=>({...a,imgs:(a.imgs||[]).map(i=>({...i,d:i.d||IMGS[i.id]}))})),ids=new Set(L.map(a=>a.id));S.acts=S.acts.filter(a=>own(a)!==u&&!ids.has(a.id)).concat(L)}
else if(k==='goals'){const L=d.list||[],ids=new Set(L.map(a=>a.id));S.goals=S.goals.filter(g=>own(g)!==u&&!ids.has(g.id)).concat(L)}
else if(k==='events'){const c=d.counts||{};if(Object.values(c).some(v=>typeof v==='number'))S.cnt[u]=c;else Object.assign(S.cnt,c)}
else{const L=d.items||[],ids=new Set(L.map(a=>a.id));S.fb=S.fb.filter(f=>own(f)!==u&&!ids.has(f.id)).concat(L)}
